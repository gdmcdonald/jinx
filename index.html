<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="config.js"></script>
    <script>
      document.title = CONFIG.title;
      document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.' + (CONFIG.accentColor || 'violet') + '.min.css">');
if (CONFIG.goatCounter) {
        document.write('<script>window.goatcounter={path:function(p){return location.host+p}}<\/script>');
        document.write('<script data-goatcounter="https://' + CONFIG.goatCounter + '.goatcounter.com/count" async src="//gc.zgo.at/count.js"><\/script>');
      }
    </script>
    <link rel="stylesheet" href="styles.css">
    <script>document.write('<script src="links.js?v=' + Date.now() + '"><\/script>')</script>
</head>
<body>
    <main class="container" id="main-container">
        <header>
            <hgroup class="container" style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem;">
                <h2 id="site-title" style="margin: 0;"></h2>
                <span style="display:flex;align-items:center;gap:0.75rem">
                    <a id="github-link" href="#" target="_blank" title="View on GitHub" style="display:flex;align-items:center;color:inherit;opacity:0.6">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
                    </a>
                    <a id="edit-link" href="#" target="_blank" style="white-space: nowrap;">✏️ Edit links</a>
                </span>
            </hgroup>
            <!-- Search Section -->
                <input
                        type="search"
                        id="search-input"
                        placeholder="Search links... (shortcut, description, or URL)"
                        autocomplete="off"
                    >
                <span id="search-results-count"></span>
            </div>
        </header>






        <div id="table-scroll-container">
        <table id="links-container">
            <thead>
                <tr>
                    <th>Shortlink</th>
                    <th>Description</th>
                    <th>Copy</th>
                    <th>QR</th>
                </tr>
            </thead>
            <tbody>
            <!-- Links will be populated here -->
            </tbody>
        </table>
        </div>

        <div id="no-results" class="no-results" style="display: none;">
            <p>🔍 No links found matching your search.</p>
            <p>Try searching for shortcuts, descriptions, or destination URLs.</p>
        </div>

    </main>

    <footer style="position:fixed;bottom:0;right:0;padding:0.5rem 1rem;font-size:0.7rem;opacity:0.35">
        Built with <a href="https://jinx.fyi" target="_blank" style="color:inherit">Jinx</a>
    </footer>

    <script src="minisearch.js"></script>
    <script src="qrcodegen.js"></script>
    <script src="script.js"></script>
    <script>
      // Inject config into DOM after scripts load
      const titleEl = document.getElementById('site-title');
      titleEl.innerHTML = (CONFIG.emoji ? CONFIG.emoji + ' ' : '') + CONFIG.title + (CONFIG.subtitle ? ' <span style="font-size:0.6em;font-weight:normal;opacity:0.6">· ' + CONFIG.subtitle + '</span>' : '');

      const editEl = document.getElementById('edit-link');
      if (CONFIG.editUrl) {
        editEl.href = CONFIG.editUrl;
        const repoUrl = CONFIG.editUrl.replace(/\/edit\/.*$/, '');
        document.getElementById('github-link').href = repoUrl;
      } else {
        editEl.style.display = 'none';
        document.getElementById('github-link').style.display = 'none';
      }
    </script>
</body>
</html>
