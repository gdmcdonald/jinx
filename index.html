<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="src/config.js"></script>
    <script>
      document.title = CONFIG.title;
      document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.' + (CONFIG.accentColor || 'violet') + '.min.css">');
if (CONFIG.goatCounter) {
        document.write('<script>window.goatcounter={path:function(p){return location.host+p}}<\/script>');
        document.write('<script data-goatcounter="https://' + CONFIG.goatCounter + '.goatcounter.com/count" async src="//gc.zgo.at/count.js"><\/script>');
      }
    </script>
    <link rel="stylesheet" href="src/styles.css">
    <script>document.write('<script src="src/links.js?v=' + Date.now() + '"><\/script>')</script>
</head>
<body>
    <main class="container" id="main-container">
        <header>
            <hgroup class="container" style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem;">
                <h2 id="site-title" style="margin: 0;"></h2>
                <span style="display:flex;align-items:center;gap:0.75rem">
                    <a id="edit-link" href="#" target="_blank" role="button" class="outline" style="white-space: nowrap;">✏️ Edit</a>
                </span>
            </hgroup>
            <!-- Search Section -->
                <input
                        type="search"
                        id="search-input"
                        placeholder="Search links... (shortcut, description, or URL)"
                        autocomplete="off"
                    >
                <span id="search-results-count"></span>
            </div>
        </header>






        <div id="table-scroll-container">
        <table id="links-container">
            <thead>
                <tr>
                    <th>Shortlink</th>
                    <th>Description</th>
                    <th>Copy</th>
                    <th>QR</th>
                </tr>
            </thead>
            <tbody>
            <!-- Links will be populated here -->
            </tbody>
        </table>
        </div>

        <div id="no-results" class="no-results" style="display: none;">
            <p>🔍 No links found matching your search.</p>
            <p>Try searching for shortcuts, descriptions, or destination URLs.</p>
        </div>

    </main>

    <footer style="position:fixed;bottom:0;right:0;padding:0.5rem 1rem;font-size:0.7rem;opacity:0.35">
        Built with <a href="https://jinx.fyi" target="_blank" style="color:inherit">Jinx</a>
    </footer>

    <script src="src/minisearch.js"></script>
    <script src="src/qrcodegen.js"></script>
    <script src="src/script.js"></script>
    <script>
      // Inject config into DOM after scripts load
      const titleEl = document.getElementById('site-title');
      titleEl.innerHTML = '<img src="img/logo.png" alt="' + CONFIG.title + '" style="height:2em;vertical-align:middle;">' + (CONFIG.subtitle ? ' <span style="font-size:0.6em;font-weight:normal;opacity:0.6">· ' + CONFIG.subtitle + '</span>' : '');

      const editEl = document.getElementById('edit-link');
      if (CONFIG.editUrl) {
        editEl.href = CONFIG.editUrl;
        const repoUrl = CONFIG.editUrl.replace(/\/edit\/.*$/, '');
        document.getElementById('github-link').href = repoUrl;
      } else {
        editEl.style.display = 'none';
        document.getElementById('github-link').style.display = 'none';
      }
    </script>
</body>
</html>
